<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details | {{portfolio_title | default:"PyCraftbyPradeep"}}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="p-4"><h4>{{portfolio_title | default:"PyCraftbyPradeep"}}<h4></div>
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card">
            <div
              class="card-header d-flex justify-content-between align-items-center bg-primary text-white"
            >
              <h4 class="mb-0">Project Details</h4>

              <a
                href="{{project.view_code_url}}"
                target="_blank"
                class="text-decoration-none text-white"
              >
                View Code
                <i class="bi bi-box-arrow-up-right"></i>
              </a>
            </div>

            <div class="card-body">
              <form action="#">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="projectname" class="form-label"
                    >Project Name</label
                  >
                  <input
                    type="text"
                    id="projectname"
                    class="form-control"
                    value="{{project.name}}"
                    readonly
                  />
                </div>

                <div class="mb-3">
                  <label for="problemstatement" class="form-label">
                    Problem Statement
                  </label>
                  <textarea
                    id="problemstatement"
                    class="form-control"
                    rows="3"
                    readonly
                  >{{project.problem_statement}}.</textarea
                  >
                </div>

                <div class="mb-3">
                  <label for="businesscase" class="form-label">
                    Business Case
                  </label>
                  <textarea
                    id="businesscase"
                    class="form-control"
                    rows="3"
                    readonly
                  >
{{project.business_case}}</textarea
                  >
                </div>

                <div class="mb-3">
                  <label for="solution" class="form-label"> Solution </label>
                  <textarea
                    id="solution"
                    class="form-control"
                    rows="4"
                    readonly
                  >
{{project.solution}}</textarea
                  >
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    {% include 'myportfolio/includes/footer.html' %}
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
