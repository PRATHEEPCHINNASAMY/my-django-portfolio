<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Skill - {{ portfolio_title|default:"PyCraftbyPradeep" }}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="p-4">
      <h4>{{ portfolio_title|default:"PyCraftbyPradeep" }}</h4>
    </div>

    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">Skill Details</h4>
            </div>

            <div class="card-body">
              {% include 'myportfolio/includes/error.html' %}

              <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                  <label class="form-label">
                    Skill Name<span class="text-danger"> *</span>
                  </label>

                  <input
                    type="text"
                    name="skill_name"
                    class="form-control"
                    value="{{ form.skill_name.value|default:'' }}"
                  />
                </div>

                <div class="mb-3">
                  <label for="percentage" class="form-label">Percentage<span class="text-danger"> *</label>
                  <input
                    type="number"
                    id="percentage"
                    name="percentage"
                    class="form-control"
                    value="{{ form.percentage.value|default:'' }}"
                  />
                </div>
                <div class="my-3 d-flex justify-content-center">
                  <button type="submit" class="btn btn-primary w-50">
                    <i class="bi bi-plus-circle"></i> Add Skill
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    {% include 'myportfolio/includes/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
