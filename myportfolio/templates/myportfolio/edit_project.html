<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Update Project - {{ portfolio_title|default:"PyCraftbyPradeep" }}
    </title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="p-4">
      <h4>{{ portfolio_title|default:"PyCraftbyPradeep" }}</h4>
    </div>

    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">Project Details</h4>
            </div>

            <div class="card-body">
              {% include 'myportfolio/includes/error.html' %}

              <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                  <label class="form-label">
                    Project Name <span class="text-danger">*</span>
                  </label>

                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ project.name }}"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    Problem Statement <span class="text-danger">*</span>
                  </label>

                  <textarea
                    name="problem_statement"
                    class="form-control"
                    rows="3"
                  >
{{ project.problem_statement}}</textarea
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    Business Case <span class="text-danger">*</span>
                  </label>

                  <textarea name="business_case" class="form-control" rows="3">
{{ project.business_case }}</textarea
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    Solution <span class="text-danger">*</span>
                  </label>

                  <textarea name="solution" class="form-control" rows="4">
{{ project.solution }}</textarea
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    View Code URL <span class="text-danger">*</span>
                  </label>

                  <input
                    type="text"
                    name="view_code_url"
                    class="form-control"
                    value="{{ project.view_code_url }}"
                  />
                </div>

                <div class="my-3 d-flex justify-content-center">
                  <button type="submit" class="btn btn-primary w-50">
                    <i class="bi bi-pencil-square"></i> Update Project
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    {% include 'myportfolio/includes/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
